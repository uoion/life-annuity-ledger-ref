name: CI — Quality, Security, Container & IaC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Security Scan & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format and lint checks
        run: |
          ruff format --check .
          ruff check .

      - name: Bandit static security scan (ISO 27001 / PA Joint Standard 2)
        run: bandit -r app

      - name: Run unit and integration test suite with coverage gate
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

  container-smoke-test:
    name: Non-Root Docker Build & Live Smoke Test
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build multi-stage non-root Docker image
        run: docker build -t life-annuity-ledger-ref:ci .

      - name: Verify container executes as non-root UID 10001
        run: |
          UID_VAL=$(docker run --rm --entrypoint id life-annuity-ledger-ref:ci -u)
          echo "Container runtime UID: $UID_VAL"
          test "$UID_VAL" = "10001"

      - name: Boot container and verify /health, /ready, /metrics, and POPIA API
        run: |
          docker run -d --name annuity-smoke -p 8000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,uid=10001,gid=10001 \
            --tmpfs /app/data:rw,noexec,nosuid,uid=10001,gid=10001 \
            life-annuity-ledger-ref:ci

          trap 'docker logs annuity-smoke || true; docker rm -f annuity-smoke >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ready | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8000/metrics | grep -q 'annuity_policies_total'

          QUOTE_RESP=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/quotes \
            -H "Content-Type: application/json" \
            -d '{"age":65,"lump_sum_zar":"1500000.00","guarantee_period_years":10,"escalation_rate_pct":"5.00"}')
          echo "Live quote response: $QUOTE_RESP"
          echo "$QUOTE_RESP" | grep -q '"quote_hash"'

          EXPLAIN_RESP=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/explain-quote \
            -H "Content-Type: application/json" \
            -d '{"age":65,"lump_sum_zar":"1500000.00","guarantee_period_years":10,"escalation_rate_pct":"5.00","client_context":"ID 6001015000081 email smoke@example.co.za"}')
          echo "$EXPLAIN_RESP" | grep -q '"provider":"deterministic_template"'
          ! echo "$EXPLAIN_RESP" | grep -q '6001015000081'

  iac-and-k8s-validate:
    name: Terraform (AWS af-south-1) & Kubernetes Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format and offline schema validation
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Validate Kubernetes YAML manifests
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c '
          from pathlib import Path
          import yaml
          for f in sorted(Path("deploy/k8s").glob("*.yaml")):
              doc = yaml.safe_load(f.read_text(encoding="utf-8"))
              assert doc["apiVersion"] and doc["kind"], f"Invalid manifest: {f}"
              print(f"Validated K8s manifest: {f} ({doc["kind"]})")
          '