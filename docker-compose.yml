services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: life-annuity-ledger-ref:local
    container_name: life-annuity-ledger-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local-docker
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:////app/data/annuity_ledger.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    volumes:
      - annuity_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  annuity_data:
